name: CI

# Basic checks only, to keep GitHub Actions minutes low: pull requests and
# manual runs. `pnpm run doctor` and `pnpm audit` run locally when upgrading.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  OPENSPEC_TELEMETRY: 0
  EXPO_PUBLIC_API_URL: https://jsonplaceholder.typicode.com
  EXPO_PUBLIC_ENV: development

jobs:
  quality:
    name: Format, verify, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      # typecheck, lint, unit tests, tooling tests, OpenSpec, skills check.
      - name: Verify
        run: pnpm verify
